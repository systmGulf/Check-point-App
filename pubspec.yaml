name: employee_mangement
description: ""
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  # 🌍 Localization & Internationalization
  easy_localization: ^3.0.6
  intl: 0.20.2
  flutter_en_json_extractor: ^0.0.5
  flutter_ar_json_extractor: ^0.0.7


  # 🧠 State Management & DI
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3

 
  # 🌐 Networking & Connectivity
  http: ^1.2.2
  connectivity_plus: ^6.1.2


  # 📍 Location & Maps
  location: ^8.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.1.0


  # 🧾 HR Management Core Package

  hr_management_system_package:
  # Local Path ✅
    path: C:\Users\osama\Desktop\Check-point-package
  # Remote path ✅  
    # git:
    #   url: https://github.com/systmGulf/Check-point-package.git
    #   ref: TOT


  # 🎨 UI / UX / Animation
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  lottie: ^3.3.0
  animate_do: ^4.2.0
  analog_clock: ^0.1.0
  dotted_line: ^3.2.2
  expansion_tile_group: ^2.2.0
  slide_switcher: ^1.1.2
  sliding_clipped_nav_bar: ^3.1.1
  flutter_speed_dial: ^7.0.0
  flutter_advanced_switch: ^3.1.0
  flutter_swipe_button: ^2.1.3
  flutter_xlider: ^3.5.0
  profile_view: ^1.0.0
  modal_progress_hud_nsn: ^0.5.1
  overlay_loader_with_app_icon: ^0.0.4
  easy_date_timeline: ^2.0.9
  simple_progress_indicators: ^0.2.0
  percent_indicator: ^4.2.4
  timeline_tile: ^2.0.0


  # 📊 Charts & Data Visualization
  fl_chart: ^0.71.0
  pie_chart: ^5.4.0


  # 🖼 Images & Media
  cached_network_image: ^3.4.1
  image: ^4.3.0
  image_picker: ^1.1.2


  # 📂 Files / Excel / Sheets
  excel: ^4.0.6
  spreadsheet_decoder: ^2.3.0


  # 🔔 Notifications & Feedback
  fluttertoast: ^8.2.10
  top_snackbar_flutter: ^3.1.0


  # 🔐 Permissions & Device Info
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0


  # 🔍 Search & Utilities
  search_app_bar_page: ^2.4.2
  multi_dropdown: ^3.0.1
  collection: ^1.18.0


  # 🌐 Web & External Content
  url_launcher: ^6.0.20
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.3.1
  webview_flutter_wkwebview: ^3.15.0

 
  # 🧱 Skeletons & Loaders
  skeletonizer: ^2.1.0+1

  
  # 💾 Local Storage & Sharing
  shared_preferences: ^2.3.5
  share_plus: ^11.0.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animated_images/attendance_done_animated_image.json
    - assets/translations/
    - shorebird.yaml

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/vodaphone.png
