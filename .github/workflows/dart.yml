name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - profile
          - debug

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-26
    env:
      BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'http://ems.runasp.net/api/' }}

    steps:
      - name: Checkout App Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout path dependency
        uses: actions/checkout@v7
        with:
          repository: systmGulf/Check-point-package
          ref: tot-6ff5d02
          path: Check-point-package
          fetch-depth: 0
          token: ${{ secrets.CHECK_POINT_PACKAGE_TOKEN || github.token }}

      - name: Link local package dependency
        run: ln -sfn "$GITHUB_WORKSPACE/Check-point-package" ../Check-point-package

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check required app config
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Config BASE_URL is empty or unset."
            echo "Missing required configuration: BASE_URL"
            exit 1
          fi
          echo "BASE_URL is set: yes"

      - name: Create package env files
        run: |
          echo "BASE_URL=$BASE_URL" > ../Check-point-package/.env.dev
          echo "BASE_URL=$BASE_URL" > ../Check-point-package/.env.prod

      - name: Get dependencies
        run: flutter pub get

      - name: Build Runner (Code Generation)
        run: |
          if grep -q "build_runner:" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs --force-jit
          else
            echo "No build_runner dependency in app pubspec, skipping app code generation."
          fi

          if grep -q "build_runner:" ../Check-point-package/pubspec.yaml; then
            (
              cd ../Check-point-package
              dart run build_runner build --delete-conflicting-outputs --force-jit
            )
          else
            echo "No build_runner dependency in package pubspec, skipping package code generation."
          fi

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Verify required Apple SDK
        run: |
          XCODE_VERSION=$(xcodebuild -version | awk '/Xcode/ {print $2}')
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          XCODE_MAJOR=${XCODE_VERSION%%.*}
          IOS_SDK_MAJOR=${IOS_SDK_VERSION%%.*}

          echo "Detected Xcode: $XCODE_VERSION"
          echo "Detected iPhoneOS SDK: $IOS_SDK_VERSION"

          if [ "$XCODE_MAJOR" -lt 26 ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "::error::IPA builds for App Store delivery now require Xcode 26+ and the iOS 26 SDK+."
            exit 1
          fi

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Build iOS (no codesign)
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
          EXPANDED_CODE_SIGN_IDENTITY: ''
          DEVELOPMENT_TEAM: ''
          PROVISIONING_PROFILE_SPECIFIER: ''
        run: flutter build ios --${{ github.event.inputs.build_mode || 'release' }} --no-codesign

      - name: Upload Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-point-runner-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under build/ios/iphoneos" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf build/ipa-payload
          mkdir -p build/ipa-payload/Payload
          cp -R "$APP_PATH" build/ipa-payload/Payload/
          (cd build/ipa-payload && zip -qr ../check-point-unsigned.ipa Payload)
          echo "Created build/check-point-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-point-unsigned-ipa
          path: build/check-point-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
