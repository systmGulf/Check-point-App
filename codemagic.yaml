# Codemagic configuration file for building an unsigned Flutter iOS IPA and publishing it to GitHub Releases.

workflows:
  ios-build-and-publish:
    name: iOS IPA Build and Publish
    
    # Use a modern macOS runner for fast, stable iOS builds
    instance_type: mac_mini_m2
    
    environment:
      # Specify the Flutter version you want to use (e.g., stable, 3.16.x)
      flutter: 3.32.0
      # Specify the Xcode version
      xcode: 16.1
      cocoapods: default
      
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
          
      - name: Update and Install Pods
        script: |
          # Codemagic handles working directory automatically.
          # We perform a full pod setup here, similar to the original workflow.
          cd $CM_BUILD_DIR/ios
          pod repo update
          pod install

      - name: Build iOS App (Unsigned Release)
        script: |
          # This is the direct equivalent of your GitHub Action command.
          # It generates Runner.app, which Codemagic then automatically
          # packages into an IPA file after this script is complete.
          flutter build ios --release --no-codesign
          
    # Define which files should be treated as build artifacts
    artifacts:
      # Automatically find the generated IPA file for distribution
      - $CM_BUILD_DIR/build/ios/iphoneos/*.ipa
